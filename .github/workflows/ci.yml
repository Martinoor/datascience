name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.15"
  IMAGE_NAME: churn-explorer

jobs:
  lint:
    name: Lint & lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Install dev dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Run tests with coverage
        run: uv run pytest --cov-report=xml --junitxml=junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml

  docker:
    name: Docker build, smoke test & publish
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lower-case image reference
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: churn-explorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          # the installed package works inside the image
          docker run --rm --entrypoint python churn-explorer:ci -m churn_app.sample_data --users 50 --out /tmp/s.parquet
          docker run -d --name smoke -p 8501:8501 churn-explorer:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs smoke
          test "$status" = "healthy"
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS http://localhost:8501/ | grep -q "<title>Streamlit</title>"
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        id: dockerhub
        if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Add Docker Hub tags
        id: tags
        run: |
          {
            echo 'list<<EOF'
            echo "${{ steps.meta.outputs.tags }}"
            if [ "${{ steps.dockerhub.outcome }}" = "success" ]; then
              echo "${{ steps.meta.outputs.tags }}" | sed "s#^${{ steps.ref.outputs.image }}#docker.io/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}#"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
