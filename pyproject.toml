[project]
name = "churn-app"
version = "1.0.0"
description = "Streamlit explorer and churn model for the Kaggle churn-prediction-25-26 streaming-service logs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Martino Orioli" }]
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<8",
    "pyarrow>=18",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_app"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=churn_app --cov-report=term-missing"
markers = ["slow: end-to-end tests that run the Streamlit app"]
filterwarnings = ["error::FutureWarning:churn_app.*"]

[tool.coverage.run]
branch = true
source = ["churn_app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 120
target-version = "py312"
# The research code predates this app and is kept as-is.
extend-exclude = ["final_experiments", "*.ipynb", "feature_pipeline.py", "kaggle_submit.py",
                  "submission_utils.py", "train_event_ensemble.py", "transformer_model.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PD", "NPY", "RUF"]
ignore = [
    "N803", "N806",  # sklearn-style X / X_train names
    "PD101",         # nunique() > 1 reads clearer than the suggested idiom
]

[tool.ruff.lint.per-file-ignores]
"src/churn_app/sample_data.py" = ["E501"]  # verbatim user-agent strings
"tests/conftest.py" = ["E501"]             # one fixture event per line

[tool.ruff.lint.isort]
known-first-party = ["churn_app"]
